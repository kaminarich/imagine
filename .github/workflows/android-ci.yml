name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NCNN_VERSION: "20260526"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and glslang
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools

      - name: Download ncnn Android Vulkan shared libs
        run: |
          mkdir -p app/ncnn-android
          wget -q "https://github.com/Tencent/ncnn/releases/download/${{ env.NCNN_VERSION }}/ncnn-${{ env.NCNN_VERSION }}-android-vulkan-shared.zip" -O /tmp/ncnn.zip
          unzip -q /tmp/ncnn.zip -d /tmp/ncnn
          # zip layout: ncnn-<ver>-android-vulkan-shared/<abi>/lib/libncnn.so
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/ncnn-android/$abi/lib"
            cp -r "/tmp/ncnn/ncnn-${{ env.NCNN_VERSION }}-android-vulkan-shared/$abi/include" "app/ncnn-android/$abi/" || true
            cp "/tmp/ncnn/ncnn-${{ env.NCNN_VERSION }}-android-vulkan-shared/$abi/lib/libncnn.so" "app/ncnn-android/$abi/lib/"
          done
          find app/ncnn-android -name "*.so" -o -name "net.h" | head
          rm -rf /tmp/ncnn /tmp/ncnn.zip

      - name: Download Real-ESRGAN ncnn models
        run: |
          mkdir -p app/src/main/assets/models
          # Verified: v0.2.5.0 ubuntu release zip bundles models/ with .param/.bin files
          wget -q "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip" -O /tmp/models.zip
          unzip -j -o /tmp/models.zip "models/*" -d app/src/main/assets/models/
          ls -la app/src/main/assets/models/
          rm /tmp/models.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          if [ ! -s app/release.jks ]; then echo "keystore secret missing"; exit 1; fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          # fail loudly if the APK ended up debug-signed or unsigned
          ls -la app/build/outputs/apk/release/

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md << 'EOF'
**Changes in v1.0.0**

### Cloud Enhancements
- **Real error messages** — CloudEngine now surfaces actual Replicate API errors (HTTP status, error detail) instead of generic "Failed to create prediction"
- Fixed model version resolution — uses \`latest_version.id\` from \`/v1/models\` endpoint
- Correct per-model input schemas: Real-ESRGAN (\`image\` + \`scale\` + \`face_enhance\`), CodeFormer (\`image\` + \`upscale\` + fidelity/background/face params), GFPGAN (\`img\` + \`scale\`)
- Upload via \`/v1/files\` multipart (was base64 data URL) — supports larger images
- Sync-mode prediction with \`Prefer: wait\` header (up to 60s), then polls every 2s for ~5 min
- All cloud requests include \`Authorization: Bearer <token>\` (was \`Token\`)

### Core Fixes
- Fixed x4 crash: clamp output bitmaps to ≤100MB before drawing
- Restored \`RoundedCornerShape\` import
- GPU init failure no longer crashes app

### Build
- GitHub Actions CI builds signed release APK on every push to main
- APK attached to this release

**Full changelog**: https://github.com/kaminarich/imagine/commits/v1.0.0
EOF

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Imagine v1.0.0"
          draft: false
          prerelease: false
          body_path: /tmp/release-notes.md
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagine-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
